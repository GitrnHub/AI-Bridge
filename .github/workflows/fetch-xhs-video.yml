name: Fetch XHS video for analysis

on:
  push:
    paths:
      - '.github/workflows/fetch-xhs-video.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Probe CDN and download source video
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://sns-video-hw.xhscdn.com/spectrum/1040g0jg324qmr6qq1me05ph8c8n1omv3g37fdj0'
          mkdir -p out/frames
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36'
          curl -L --http1.1 --connect-timeout 10 --max-time 30 \
            -A "$UA" -H 'Referer: https://www.xiaohongshu.com/' \
            -H 'Range: bytes=0-1023' -D out/probe_headers.txt \
            "$URL" -o out/probe.bin || true
          cat out/probe_headers.txt || true
          ls -lh out/probe.bin || true
          curl -L --http1.1 --fail --connect-timeout 10 --max-time 120 \
            --speed-time 20 --speed-limit 1024 --retry 2 --retry-delay 2 \
            -A "$UA" -H 'Referer: https://www.xiaohongshu.com/' \
            -D out/download_headers.txt "$URL" -o out/source_video
          file out/source_video | tee out/file.txt
          ls -lh out/source_video | tee out/size.txt

      - name: Probe and extract representative frames
        shell: bash
        run: |
          set -euxo pipefail
          ffprobe -hide_banner -v error -show_format -show_streams out/source_video > out/ffprobe.txt
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/source_video)
          export DURATION
          python3 - <<'PY'
          import os, subprocess
          dur=float(os.environ['DURATION'])
          n=16
          for i in range(n):
              t=dur*(i+0.5)/n
              subprocess.run(['ffmpeg','-y','-ss',f'{t:.3f}','-i','out/source_video','-frames:v','1','-q:v','2',f'out/frames/frame_{i+1:02d}.jpg'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY
          ffmpeg -y -pattern_type glob -i 'out/frames/*.jpg' -vf 'scale=480:-1,tile=4x4:padding=4:margin=4' -frames:v 1 out/contact_sheet.jpg

      - name: Upload video and analysis frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xhs-video-analysis
          path: out/
          retention-days: 1
          if-no-files-found: error
