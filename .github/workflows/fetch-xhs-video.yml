name: Fetch XHS video for analysis

on:
  push:
    paths:
      - '.github/workflows/fetch-xhs-video.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download source video
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://sns-video-hw.xhscdn.com/spectrum/1040g0jg324qmr6qq1me05ph8c8n1omv3g37fdj0'
          mkdir -p out
          curl -L --http1.1 --fail --connect-timeout 10 --max-time 120 \
            --speed-time 20 --speed-limit 1024 --retry 2 --retry-delay 2 \
            -A 'Mozilla/5.0' -H 'Referer: https://www.xiaohongshu.com/' \
            "$URL" -o out/source_video.mp4
          file out/source_video.mp4 | tee out/file.txt
          ls -lh out/source_video.mp4 | tee out/size.txt

      - name: Upload source video
        uses: actions/upload-artifact@v4
        with:
          name: xhs-source-video
          path: out/
          retention-days: 1
          if-no-files-found: error
