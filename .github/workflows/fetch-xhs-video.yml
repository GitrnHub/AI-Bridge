name: Fetch XHS video for analysis

on:
  push:
    paths:
      - '.github/workflows/fetch-xhs-video.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Download and extract frames
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://sns-video-hw.xhscdn.com/spectrum/1040g0jg324qmr6qq1me05ph8c8n1omv3g37fdj0'
          rm -rf analysis-output
          mkdir -p analysis-output/frames
          curl -L --http1.1 --fail --connect-timeout 10 --max-time 120 \
            --speed-time 20 --speed-limit 1024 --retry 2 --retry-delay 2 \
            -A 'Mozilla/5.0' -H 'Referer: https://www.xiaohongshu.com/' \
            "$URL" -o source_video.mp4
          ffprobe -hide_banner -v error -show_format -show_streams source_video.mp4 > analysis-output/ffprobe.txt
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 source_video.mp4)
          export DURATION
          python3 - <<'PY'
          import os, subprocess
          dur=float(os.environ['DURATION'])
          n=16
          for i in range(n):
              t=dur*(i+0.5)/n
              subprocess.run(['ffmpeg','-y','-ss',f'{t:.3f}','-i','source_video.mp4','-frames:v','1','-q:v','2',f'analysis-output/frames/frame_{i+1:02d}.jpg'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY
          ffmpeg -y -pattern_type glob -i 'analysis-output/frames/*.jpg' -vf 'scale=360:-1,tile=4x4:padding=4:margin=4' -frames:v 1 -update 1 analysis-output/contact_sheet.jpg
          rm -f source_video.mp4

      - name: Commit analysis output
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis-output
          git commit -m 'Add extracted frames for XHS video analysis' || exit 0
          git push
