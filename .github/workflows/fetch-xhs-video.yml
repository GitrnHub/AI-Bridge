name: Fetch XHS video for analysis

on:
  push:
    paths:
      - '.github/workflows/fetch-xhs-video.yml'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download source video
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://sns-video-hw.xhscdn.com/spectrum/1040g0jg324qmr6qq1me05ph8c8n1omv3g37fdj0'
          mkdir -p out/frames
          curl -L --fail --retry 4 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            -H 'Referer: https://www.xiaohongshu.com/' \
            "$URL" -o out/source_video
          file out/source_video | tee out/file.txt
          ls -lh out/source_video | tee out/size.txt

      - name: Probe and extract representative frames
        shell: bash
        run: |
          set -euxo pipefail
          ffprobe -hide_banner -v error -show_format -show_streams out/source_video > out/ffprobe.txt
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/source_video)
          export DURATION
          python3 - <<'PY'
          import os, subprocess
          dur=float(os.environ['DURATION'])
          n=12
          for i in range(n):
              t=dur*(i+0.5)/n
              subprocess.run(['ffmpeg','-y','-ss',f'{t:.3f}','-i','out/source_video','-frames:v','1','-q:v','2',f'out/frames/frame_{i+1:02d}.jpg'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          PY
          ffmpeg -y -pattern_type glob -i 'out/frames/*.jpg' -vf 'scale=480:-1,tile=4x3:padding=4:margin=4' -frames:v 1 out/contact_sheet.jpg

      - name: Upload video and analysis frames
        uses: actions/upload-artifact@v4
        with:
          name: xhs-video-analysis
          path: out/
          retention-days: 1
          if-no-files-found: error
